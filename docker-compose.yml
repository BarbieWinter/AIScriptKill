services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./engine:/app/engine
      - ./script-packages:/app/script-packages
    command: uvicorn engine.api.main:app --host 0.0.0.0 --port 8000 --reload --ws-max-size 65536 --ws-max-queue 4

  room-event-relay:
    build:
      context: .
      dockerfile: engine/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      ROOM_EVENTS_V1: "true"
    volumes:
      - ./engine:/app/engine
    command: uv run uvicorn engine.relay.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_USE_MOCK: "false"
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${SUPABASE_URL}}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY}}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - engine

  supabase:
    image: supabase/supabase-local:latest
    ports:
      - "54321:54321"  # API
      - "54322:54322"  # DB (直接连接)
    environment:
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters
volumes:
  pgdata:
