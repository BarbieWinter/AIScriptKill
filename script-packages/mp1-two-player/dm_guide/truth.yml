truth:
  case_summary: "知情人于二十点零五分违规使用备用钥匙，从后侧维修门进入值班室寻找缺失的交接簿。调查员二十点十分抵达后一直看守走廊入口，因此没有看见更早的进入。二十点二十分的金属声来自知情人掉落钥匙串；门锁始终完好。知情人隐瞒违规进入，但现有证据不能证明其破门或损毁记录。"
  timeline:
    - time: "20:05"
      event: "知情人用备用钥匙从后侧维修门进入值班室。"
      hidden: true
    - time: "20:10"
      event: "固定相机拍到调查员抵达；此后走廊入口一直在其视线内。"
      hidden: false
    - time: "20:20"
      event: "知情人在室内掉落黄铜钥匙串，产生目击便签记录的金属声。"
      hidden: true
    - time: "20:21"
      event: "调查员看见知情人持钥匙从值班室正门离开。"
      hidden: true
