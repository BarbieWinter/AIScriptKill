id: "investigation"
name: "核对口供"
sort_order: 0
allowed_transitions: ["final-judgment"]
entry_conditions: []
exit_conditions: []
available_actions: []
available_characters: ["investigator", "insider"]
chapters:
  investigator: "investigator-investigation"
  insider: "insider-investigation"
public_materials:
  - id: "arrival-photo"
    reveal_at: "stage_enter"
  - id: "witness-note"
    reveal_at: "all_players_read"
discussion:
  suggested_minutes: 8
  close_policy: "all_players"
settlement:
  mode: "secret_vote"
  settlement_id: "investigation-vote"
  question: "二十点二十分的金属声最可能来自哪种情况？"
  options:
    - id: "investigator-account"
      text: "有人在二十点二十分强行进入值班室"
      outcome_id: "trust-investigator"
    - id: "insider-account"
      text: "有人早已在室内，金属声来自钥匙掉落"
      outcome_id: "trust-insider"
  tie_outcome_id: "split-vote"
  reveal: "named_ballots"
  submission_change: "forbidden"
  default_effect: "record_and_continue"
hints:
  - id: "timeline"
    levels:
      - "先确认两人在 20:10 与 20:20 各自位于哪里。"
      - "区分走廊入口、值班室正门与后侧维修门。"
      - "问清哪些内容是亲眼观察、本人承认、记录或推断。"
