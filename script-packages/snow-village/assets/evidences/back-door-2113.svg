  <polygon points="820,210 1070,245 1070,690 820,710" fill="#d99946" opacity=".68"/>
  <path d="M1330 360 C1440 390 1480 550 1420 700 L1540 700 L1540 250 Z" fill="#10141a" opacity=".94"/>
  <text x="110" y="140" fill="#d6e1e8" font-size="46" font-family="monospace">21:13</text>
  <text x="800" y="790" text-anchor="middle" fill="#d6e1e8" font-size="34" font-family="sans-serif">占位图：只允许使用人工定义观察，不作身份推断</text>
