[project]
name = "aiscriptkill-engine"
version = "0.1.0"
description = "AI Script Murder Mystery Game Engine — LangGraph + FastAPI + RAG"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",           # API 网关
    "uvicorn[standard]>=0.32.0",  # ASGI 服务器
    "pydantic>=2.10.0",           # 数据验证
    "pydantic-settings>=2.6.0",   # 配置管理
    "PyJWT[crypto]>=2.10.0",
    "python-multipart>=0.0.20",

    # AI & LangGraph
    "langgraph>=0.3.0",           # 状态图引擎（核心状态机）
    "langchain>=0.3.0",           # LLM 调用框架
    "langchain-anthropic>=0.3.0", # Anthropic 模型适配器
    "langchain-openai>=0.3.0",    # OpenAI 模型适配器（备选回退）

    # RAG & 向量
    "sentence-transformers>=3.0",  # 文本嵌入生成
    "pgvector>=0.3.0",            # PostgreSQL 向量扩展客户端

    # 数据库
    "supabase>=2.5.0",            # Supabase 客户端
    "asyncpg>=0.30.0",            # 异步 PostgreSQL 驱动
    "sqlalchemy[asyncio]>=2.0.0", # ORM

    # 媒体处理
    "edge-tts>=6.0.0",            # 文字转语音（微软 Edge TTS）

    # 工具
    "pyyaml>=6.0",                # YAML 解析（剧本包配置）
    "jinja2>=3.1",                # 模板引擎（Prompt 模板）
    "httpx>=0.28.0",              # HTTP 客户端
    "python-dotenv>=1.0.0",       # 环境变量管理
    "redis>=5.0.0",               # 缓存 / 队列（可选）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "httpx2>=2.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
asyncio_mode = "auto"
