[project]
name = "aiscriptkill-engine"
version = "0.1.0"
description = "AI Script Murder Mystery Game Engine — LangGraph + FastAPI + RAG"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",           # API 网关
    "uvicorn[standard]>=0.32.0",  # ASGI 服务器
    "pydantic>=2.10.0",           # 数据验证
    "pydantic-settings>=2.6.0",   # 配置管理
    "PyJWT[crypto]>=2.10.0",      # 加密扩展依赖
    "python-multipart>=0.0.20",     # multipart 表单与剧本包上传解析

    # AI 与 LangGraph
    "langgraph>=1.2.8",           # 状态图引擎（核心状态机，1.x API）
    "langchain>=1.3.11",          # LLM 调用框架（1.x API）
    "langchain-anthropic>=1.4.8", # Anthropic 模型适配器（1.x API）
    "langchain-openai>=1.3.3",    # OpenAI 模型适配器（备选回退，1.x API）

    # RAG 与向量
    "sentence-transformers>=3.0",  # 文本嵌入生成
    "pgvector>=0.3.0",            # PostgreSQL 向量扩展客户端

    # 数据库
    "supabase>=2.5.0",            # Supabase 客户端
    "asyncpg>=0.30.0",            # 异步 PostgreSQL 驱动
    "sqlalchemy[asyncio]>=2.0.0", # ORM 数据映射

    # 媒体处理
    "edge-tts>=6.0.0",            # 文字转语音（微软 Edge TTS）

    # 工具
    "pyyaml>=6.0",                # YAML 解析（剧本包配置）
    "jinja2>=3.1",                # 模板引擎（Prompt 模板）
    "httpx>=0.28.0",              # HTTP 客户端
    "python-dotenv>=1.0.0",       # 环境变量管理
    "redis>=5.0.0",               # 缓存 / 队列（可选）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",                  # 后端测试运行器
    "pytest-asyncio>=0.24.0",       # 异步测试支持
    "pytest-cov>=5.0.0",            # 后端覆盖率报告
    "httpx>=0.28.0",                # FastAPI 测试客户端
    "httpx2>=2.0.0",                # HTTP/2 客户端兼容验证
    "ruff>=0.6.0",                  # Python lint 与格式化
    "basedpyright>=1.31.4",         # 生产后端静态类型检查
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
asyncio_mode = "auto"
